# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":apple: Build binaries, sign and notarize macOS"
    key: build-sign-notarize
    command: .buildkite/commands/build-sign-notarize.sh
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths:
      - packages/cli/dist/bin/binaries.json
      - packages/cli/dist/release/*
    notify:
      - github_commit_status:
          context: Build, Sign & Notarize
